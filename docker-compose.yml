name: opspilot

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opspilot_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: opspilot
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./infra/postgres/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot_owner -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["python", "-m", "app.migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://opspilot_owner:${POSTGRES_PASSWORD}@db:5432/opspilot
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    <<: *hardening

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://opspilot_app:${APP_DB_PASSWORD}@db:5432/opspilot
      AUTO_CREATE_SCHEMA: "false"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?set WEBHOOK_TOKEN in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8000:8000"   # local only: /metrics and the webhook are not public
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    <<: *hardening

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "8080:8080"
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    <<: *hardening

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [backend]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    environment:
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s' "$$WEBHOOK_TOKEN" > /tmp/webhook_token
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/tmp/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  dbdata:
  promdata:
  grafanadata:
